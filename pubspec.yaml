name: donkey_calendar
description: Donkey Calendar - AI study calendar
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  http_parser: ^4.0.0
  shared_preferences: ^2.2.0
  image_picker: ^1.0.0
  uuid: ^4.0.0
  crypto: ^3.0.0
  flutter_markdown: ^0.7.3
  gal: ^2.3.0
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  path: ^1.9.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.24.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "donkey-calendar.png"
  adaptive_icon_foreground: "donkey-calendar-fg.png"
  adaptive_icon_background: "#5EAD6C"
  remove_alpha_channel: false

flutter:
  uses-material-design: true
  assets:
    - assets/donkey.png
  fonts:
    - family: Inter
      fonts:
        - asset: "assets/fonts/Inter.ttf"
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic
    - family: JetBrainsMono
      fonts:
        - asset: "assets/fonts/JetBrainsMono.ttf"
